name: Build Release

# 打 tag（如 v1.0.0）时自动构建 exe 并挂到 Release 上
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:      # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: python build_exe.py

      - name: Verify artifact
        run: |
          if (-not (Test-Path "dist/SitReminder.exe")) { throw "SitReminder.exe not produced" }
          Get-Item "dist/SitReminder.exe" | Format-List Name, Length
        shell: pwsh

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SitReminder.exe
          generate_release_notes: true

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitReminder-windows
          path: dist/SitReminder.exe
