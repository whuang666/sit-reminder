name: Build Release

# 打 tag（如 v1.0.0）时自动构建 exe 并挂到 Release 上
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:      # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # setup-python 会把解释器目录前置到 PATH。
          # 下面统一用 `python` 调用，保证「装包的解释器」和「跑脚本的解释器」
          # 是同一个 —— 之前 build_exe.py 里用 sys.executable 自检，在 runner 上
          # 可能落到别的解释器，导致 0 秒就 import 失败退出。
          update-environment: true

      - name: Show interpreter
        shell: pwsh
        run: |
          python -c "import sys, tkinter; print('python  =', sys.executable); print('version =', sys.version); print('tkinter =', tkinter.TkVersion)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: python build_exe.py --no-install

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SitReminder.exe")) { throw "SitReminder.exe not produced" }
          Get-Item "dist/SitReminder.exe" | Format-List Name, Length

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SitReminder.exe
          generate_release_notes: true

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitReminder-windows
          path: dist/SitReminder.exe
          if-no-files-found: error
