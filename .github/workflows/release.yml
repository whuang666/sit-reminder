name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          update-environment: true

      - name: Show interpreter
        shell: pwsh
        run: |
          python -c "import sys, tkinter; print('python  =', sys.executable); print('version =', sys.version); print('tkinter =', tkinter.TkVersion)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      # 把构建输出写进 $GITHUB_STEP_SUMMARY —— 它可以通过无认证的
      # check-runs output 接口读到，绕开 logs/artifact 的 403/401。
      - name: Build exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = python build_exe.py --no-install 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"

          $body = "``````text`n$out`n``````"
          # 摘要上限 1MB，截断到 20k 足够看报错
          if ($body.Length -gt 20000) { $body = $body.Substring($body.Length - 20000) }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## build_exe.py output (exit $code)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $body
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`n## env"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("``````text`n" + (python -c "import sys,platform;print(sys.executable);print(sys.version);print(platform.platform())" | Out-String) + "`n``````")

          if ($code -ne 0) { exit $code }

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SitReminder.exe")) { throw "SitReminder.exe not produced" }
          Get-Item "dist/SitReminder.exe" | Format-List Name, Length

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SitReminder.exe
          generate_release_notes: true

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitReminder-windows
          path: dist/SitReminder.exe
          if-no-files-found: error
