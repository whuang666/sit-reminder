name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          update-environment: true

      - name: Show interpreter
        shell: pwsh
        run: |
          python -c "import sys, tkinter; print('python  =', sys.executable); print('version =', sys.version); print('tkinter =', tkinter.TkVersion)"
          python -m pip --version
          python -c "import PyInstaller" 2>&1 | Out-String | Write-Host

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Post-install check
        shell: pwsh
        run: |
          Write-Host "after install:"
          python -c "import PyInstaller, sys; print('PyInstaller', PyInstaller.__version__, 'in', sys.executable)"

      # 把完整输出写进 _ci_report 分支，这样一定能读到报错
      - name: Build exe
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          python build_exe.py --no-install *> ci_report.txt
          $code = $LASTEXITCODE
          Write-Host "exit=$code"
          Get-Content ci_report.txt -Tail 120
          "`n===== exit code: $code =====" | Add-Content ci_report.txt
          if ($code -ne 0) { exit $code }

      - name: Publish report to branch (failure path)
        if: failure()
        shell: pwsh
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git checkout --orphan _ci_report 2>$null
          git rm -r --cached . -q 2>$null
          New-Item -ItemType Directory -Force -Path _ci | Out-Null
          if (Test-Path ci_report.txt) { Copy-Item ci_report.txt _ci/ }
          Get-ChildItem build -Recurse -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName "_ci/$($_.Name)" }
          python -c "import sys;print(sys.executable);print(sys.version)" > _ci/env.txt 2>&1
          git add -f _ci
          git commit -m "ci report for $env:GITHUB_SHA"
          git push -f origin _ci_report
        continue-on-error: true

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SitReminder.exe")) { throw "SitReminder.exe not produced" }
          Get-Item "dist/SitReminder.exe" | Format-List Name, Length

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SitReminder.exe
          generate_release_notes: true

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitReminder-windows
          path: dist/SitReminder.exe
          if-no-files-found: error
